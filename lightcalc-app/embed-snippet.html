<!-- ZimaLED LightCalc — embed. Сборка автогенерирована build_embed.py -->
<link rel="stylesheet" href="/lightcalc-app/lightcalc.css?v=20260826-ui14">
<div id="zlc-app" class="zlc-root"></div>
<script type="module">
  // Настраиваем базовый путь для загрузки данных из JS
  window.__ZLC_BASE__ = "/lightcalc-app/";
  window.__ZLC_VERSION__ = "20260826-ui14";
  // Точка входа
  import(`${window.__ZLC_BASE__}assets/js/embed.js?v=${window.__ZLC_VERSION__}`).catch(err => {
    // Безопасный вывод ошибки — через textContent, без innerHTML (защита от XSS)
    const host = document.getElementById('zlc-app');
    host.innerHTML = '';
    const box = document.createElement('div');
    box.style.cssText = 'padding:40px;background:#fff5f5;border:1px solid #f16876;color:#c03030;font-family:sans-serif;border-radius:8px';
    const b = document.createElement('b');
    b.textContent = 'Не удалось загрузить калькулятор: ';
    box.append(b, document.createTextNode(String((err && err.message) || err)));
    host.appendChild(box);
  });
</script>
<noscript>
  <div style="padding:20px;background:#fff5f5;border:1px solid #f16876;border-radius:8px;color:#404040">
    Для работы калькулятора трекового освещения нужен JavaScript. Пожалуйста, включите его в настройках браузера.
  </div>
</noscript>
<!-- /ZimaLED LightCalc -->

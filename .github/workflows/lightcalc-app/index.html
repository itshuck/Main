<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZimaLED LightCalc — demo embed (local test)</title>
<style>
  body { font-family: Montserrat, Arial, sans-serif; margin: 0; padding: 20px; background: #f3f3f3; color: #404040; }
  .demo-header { padding: 16px; background: #fff; border-radius: 8px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .demo-header h1 { margin: 0 0 8px; font-size: 20px; color: #4182f5; }
  .demo-header p { margin: 0 0 4px; color: #737373; font-size: 13px; }
  .demo-header code { background: #efefef; padding: 2px 6px; border-radius: 3px; font-family: monospace; }
  @media (max-width: 600px) {
    body { padding: 6px; }
    .demo-header { padding: 10px; margin-bottom: 8px; }
  }
</style>
</head><body>
<div class="demo-header">
  <h1>ZimaLED LightCalc — demo (для локального тестирования)</h1>
  <p>Эмуляция вставки в HTML-виджет сайта zima-led.ru. Ниже — snippet с локальными путями.</p>
  <p>На продакшн (zima-led.ru) идёт файл <code>embed-snippet.html</code> — с путём <code>/lightcalc-app/</code></p>
</div>

<!-- ==== СНИППЕТ (локальные пути) ==== -->
<!-- ZimaLED LightCalc — embed. Сборка автогенерирована build_embed.py -->
<link rel="stylesheet" href="./lightcalc.css?v=20260826-ui14">
<div id="zlc-app" class="zlc-root"></div>
<script type="module">
  // Настраиваем базовый путь для загрузки данных из JS
  window.__ZLC_BASE__ = "./";
  window.__ZLC_VERSION__ = "20260826-ui14";
  // Точка входа
  import(`${window.__ZLC_BASE__}assets/js/embed.js?v=${window.__ZLC_VERSION__}`).catch(err => {
    // Безопасный вывод ошибки — через textContent, без innerHTML (защита от XSS)
    const host = document.getElementById('zlc-app');
    host.innerHTML = '';
    const box = document.createElement('div');
    box.style.cssText = 'padding:40px;background:#fff5f5;border:1px solid #f16876;color:#c03030;font-family:sans-serif;border-radius:8px';
    const b = document.createElement('b');
    b.textContent = 'Не удалось загрузить калькулятор: ';
    box.append(b, document.createTextNode(String((err && err.message) || err)));
    host.appendChild(box);
  });
</script>
<noscript>
  <div style="padding:20px;background:#fff5f5;border:1px solid #f16876;border-radius:8px;color:#404040">
    Для работы калькулятора трекового освещения нужен JavaScript. Пожалуйста, включите его в настройках браузера.
  </div>
</noscript>
<!-- /ZimaLED LightCalc -->

<!-- ==== /СНИППЕТ ==== -->
</body></html>
